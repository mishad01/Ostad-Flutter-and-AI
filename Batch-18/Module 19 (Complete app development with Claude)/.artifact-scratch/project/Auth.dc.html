<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="design-system.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&display=swap">
</helmet>

<div style="width: 390px; height: 844px; background: var(--canvas); display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: 0 0 auto; padding: 28px 28px 0 28px; display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 36px; height: 36px; border-radius: 10px; background: var(--obsidian); display: flex; align-items: center; justify-content: center;">
      <span class="font-display" style="font-size: 15px; color: #FFFFFF;">৳</span>
    </div>
    <div class="chip chip-active" style="padding: 6px 4px; gap: 2px;">
      <span style="padding: 5px 10px; border-radius: 999px; background: #fff; color: var(--ink); font-size: 10.5px; font-weight: 700;">EN</span>
      <span style="padding: 5px 10px; font-size: 10.5px; font-weight: 700; color: #fff;">বাং</span>
    </div>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 40px 28px 24px 28px; display: flex; flex-direction: column; gap: 36px;">

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span class="font-display" style="font-size: 34px; line-height: 1.1; color: var(--ink);">Welcome back.</span>
      <span style="font-size: 14px; color: var(--body); font-weight: 500;">Sign in to continue to Khata.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span class="eyebrow">Email</span>
        <input type="email" value="rahim@khata.app" aria-label="Email" style="height: 56px; padding: 0 18px; border-radius: var(--radius-input); border: 1px solid var(--accent); background: var(--surface); font-size: 14px; color: var(--ink); outline: none; box-shadow: 0 0 0 4px var(--accent-soft);">
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span class="eyebrow">Password</span>
        <input type="password" value="••••••••••" aria-label="Password" style="height: 56px; padding: 0 18px; border-radius: var(--radius-input); border: 1px solid var(--hairline); background: var(--surface); font-size: 14px; color: var(--ink); outline: none;">
      </div>
      <span style="align-self: flex-end; font-size: 12px; color: var(--accent); font-weight: 700;">Forgot password?</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <a href="Main.dc.html" class="btn-accent">Continue</a>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="divider" style="flex: 1 1 auto;"></div>
        <span style="font-size: 11px; color: var(--muted); font-weight: 600;">or continue with</span>
        <div class="divider" style="flex: 1 1 auto;"></div>
      </div>

      <div style="display: flex; gap: 10px;">
        <a href="Main.dc.html" class="btn-ghost" style="gap: 8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.66 4.1-5.5 4.1-3.3 0-6-2.7-6-6.2s2.7-6.2 6-6.2c1.9 0 3.16.8 3.9 1.5l2.66-2.56C16.84 3 14.6 2 12 2 6.98 2 2.9 6.03 2.9 11s4.08 9 9.1 9c5.25 0 8.74-3.7 8.74-8.9 0-.6-.07-1.06-.16-1.5H12Z"/></svg>
          Google
        </a>
        <a href="Main.dc.html" class="btn-ghost" style="gap: 8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16.5 2c.14 1.1-.3 2.2-1 3-.74.85-1.95 1.5-3.1 1.4-.16-1.07.35-2.2 1.03-2.9C14.2 2.6 15.4 2.05 16.5 2ZM20.8 17.2c-.5 1.16-.75 1.68-1.4 2.7-.9 1.42-2.17 3.2-3.75 3.22-1.4.02-1.76-.92-3.66-.9-1.9.01-2.3.92-3.7.9-1.58-.02-2.78-1.6-3.68-3.02C1.7 16.4.9 11.3 3.1 7.98c1.1-1.66 2.9-2.7 4.6-2.7 1.73 0 2.82 1 4.25 1 1.4 0 2.24-1 4.26-1 1.5 0 3.08.83 4.2 2.26-3.7 2.03-3.1 7.3.4 9.66Z" stroke="#0F0F12" stroke-width="0" fill="#0F0F12"/></svg>
          Apple
        </a>
      </div>
    </div>

  </div>

  <div style="flex: 0 0 auto; padding: 0 28px 28px 28px; text-align: center;">
    <span style="font-size: 12.5px; color: var(--body);">New here? </span>
    <span style="font-size: 12.5px; color: var(--accent); font-weight: 700;">Create an account</span>
  </div>

</div>
</x-dc>

  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
