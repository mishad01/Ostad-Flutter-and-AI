<div style="width: 390px; height: 844px; background: var(--canvas); position: relative; overflow: hidden;">

      <div style="display: flex; flex-direction: column; gap: 5px;">

        <div style="width: 70px; height: 8px; border-radius: 4px; background: var(--hairline);"></div>
      </div>
    </div>
    <div style="border-radius: 28px; background: var(--obsidian); height: 190px;"></div>
    <div style="height: 1px; background: var(--hairline);"></div>
    <div style="height: 90px; background: var(--hairline); opacity: 0.3; border-radius: 16px;"></div>
  </div>

    <span class="font-display" style="font-size: 19px; color: var(--ink);">Reconcile Cash in Hand</span>

    <div style="display: flex;">
      <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 5px;">

        <span class="tnum" style="font-size: 19px; color: var(--muted); font-weight: 700;">৳2,450</span>
      </div>
      <div style="width: 1px; height: 38px; background: var(--hairline); margin: 0 18px;"></div>
      <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 5px;">
        <span class="eyebrow" style="color: var(--success);">Actual in Wallet</span>
        <input type="text" value="৳2,100" aria-label="Actual cash in wallet" class="tnum" style="border: none; border-bottom: 1.5px solid var(--success); background: transparent; outline: none; font-size: 19px; color: var(--ink); font-weight: 800; font-family: 'Inter', system-ui, sans-serif; padding: 0 0 2px 0; width: 100%;">
      </div>
    </div>

    <div class="hairline-t hairline-b" style="padding: 14px 0;">
      <span class="tnum" style="font-size: 12.5px; color: var(--warning); font-weight: 700;">Difference: -৳350 is missing from your wallet.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <span class="eyebrow">How Should We Handle This?</span>

      <div style="display: flex; gap: 10px; align-items: flex-start;">
        <div style="width: 15px; height: 15px; border-radius: 999px; border: 5px solid var(--ink); flex: 0 0 auto; margin-top: 2px;"></div>
        <span style="font-size: 12px; color: var(--ink); font-weight: 600; line-height: 1.4;">Log as "Unaccounted Small Cash Expenses" under <span style="color: var(--accent); font-weight: 700;">Me – Personal</span></span>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-start;">
        <div style="width: 15px; height: 15px; border-radius: 999px; border: 1.5px solid var(--hairline); flex: 0 0 auto; margin-top: 2px;"></div>
        <span style="font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.4;">Silently adjust balance without logging an expense</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; padding-top: 4px;">
      <a href="Main.dc.html" class="btn-ghost" style="flex: 1 1 0;">Cancel</a>
      <a href="Main.dc.html" class="btn-primary" style="flex: 1 1 0;">Fix Balance</a>
